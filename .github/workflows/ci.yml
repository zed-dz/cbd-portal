name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package-lock.json is git-ignored in this repo, so `npm ci` has nothing
      # to pin against. Use it when a lockfile is committed, else a plain
      # install (same package.json ranges Vercel builds from).
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Unit tests
        run: CI=true npm test -- --watchAll=false

      # CI=true makes CRA treat lint warnings as errors — same gate as Vercel.
      - name: Build
        run: CI=true npm run build
        env:
          GENERATE_SOURCEMAP: 'false'

  # Real browser tests (Playwright, Chromium): phone 360x740 touch + desktop
  # 1280x800. The app is built against a FAKE Supabase host and every request
  # is answered from e2e/fixtures — no secrets, no production data.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build against the fake Supabase
        run: npm run e2e:build
        env:
          CI: 'true'
          INLINE_RUNTIME_CHUNK: 'false'
          GENERATE_SOURCEMAP: 'false'

      - name: Browser tests
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
